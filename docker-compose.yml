# =============================================================================
# Docker Compose for Big Data Analytics & BI - Data-Driven Cinema Management
# -----------------------------------------------------------------------------
# Provides the full local environment used by the project so reports and
# screenshots can be reproduced on any machine that has Docker installed.
#
# Services:
#   - mongodb       MongoDB 7    (port 27017)        cinema_dw data warehouse
#   - namenode      Hadoop HDFS  (port 9870 / 9000)  NameNode + Web UI
#   - datanode      Hadoop HDFS  (port 9864)         DataNode + Web UI
#   - spark         Bitnami Spark master             runs PySpark jobs
#
# Start:
#   docker compose up -d
# Stop:
#   docker compose down
# View logs:
#   docker compose logs -f <service>
# =============================================================================

services:

  mongodb:
    image: mongo:7.0
    container_name: cinema-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - cinema_net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 15s
      timeout: 5s
      retries: 10

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: cinema-namenode
    restart: unless-stopped
    hostname: namenode
    environment:
      - CLUSTER_NAME=cinema-cluster
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - CORE_CONF_hadoop_http_staticuser_user=root
      - HDFS_CONF_dfs_replication=1
      - HDFS_CONF_dfs_permissions_enabled=false
      - HDFS_CONF_dfs_namenode_rpc__bind__host=0.0.0.0
      - HDFS_CONF_dfs_namenode_servicerpc__bind__host=0.0.0.0
    ports:
      - "9870:9870"   # NameNode Web UI
      - "9000:9000"   # HDFS RPC
    volumes:
      - namenode_data:/hadoop/dfs/name
      - ./data:/data:rw
    networks:
      - cinema_net

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: cinema-datanode
    restart: unless-stopped
    hostname: datanode
    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - HDFS_CONF_dfs_replication=1
      - HDFS_CONF_dfs_permissions_enabled=false
    ports:
      - "9864:9864"   # DataNode Web UI
    volumes:
      - datanode_data:/hadoop/dfs/data
    depends_on:
      - namenode
    networks:
      - cinema_net

  spark:
    image: bitnami/spark:3.5
    container_name: cinema-spark
    restart: unless-stopped
    user: root
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
      - HDFS_HOST=namenode
      - HDFS_PORT=9000
      - MONGO_URI=mongodb://mongodb:27017/
      - MONGO_DB=cinema_dw
      - PROJECT_HDFS_RAW_MOVIELENS=/project/cinema/raw/movielens
      - PROJECT_HDFS_RAW_TMDB=/project/cinema/raw/tmdb
    ports:
      - "8080:8080"   # Spark master Web UI
      - "7077:7077"   # Spark master RPC
      - "4040:4040"   # Spark application UI
    volumes:
      - ./:/workspace:rw
    working_dir: /workspace
    depends_on:
      - namenode
      - datanode
      - mongodb
    networks:
      - cinema_net

networks:
  cinema_net:
    driver: bridge

volumes:
  mongo_data:
  namenode_data:
  datanode_data:
